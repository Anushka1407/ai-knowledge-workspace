  <text x="250" y="305" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#374151">Auth, upload, chat</text>

  <rect x="430" y="220" width="240" height="120" rx="16" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="550" y="270" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="600" fill="#15803d">FastAPI Backend</text>
