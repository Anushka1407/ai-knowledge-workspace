  <path d="M670 280 L740 280" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M960 280 L1010 280" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M550 340 L625 430" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
