name: Backend CD

on:
  workflow_run:
    workflows:
      - "Backend CI"
    types:
      - completed
    branches:
      - main

permissions:
  contents: read
  id-token: write

concurrency:
  group: backend-development
  cancel-in-progress: false

env:
  IMAGE_NAME: ai-knowledge-backend

jobs:
  deploy:
    name: Deploy Backend
    runs-on: ubuntu-latest

    if: github.event.workflow_run.conclusion == 'success'

    environment: development

    steps:
      - name: Sign in to Azure using OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy image to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEB_APP_NAME }}
          images: >-
            ${{ vars.AZURE_CONTAINER_REGISTRY }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ github.event.workflow_run.head_sha }}

      - name: Check deployed application
        shell: bash
        run: |
          APP_URL="https://app-portfolio-api-dev-uks.azurewebsites.net"

          for attempt in {1..18}; do
            echo "Health check attempt ${attempt}"

            if curl --fail --silent --show-error "${APP_URL}/health"; then
              echo
              echo "Deployment succeeded"
              exit 0
            fi

            sleep 10
          done

          echo "Deployment health check failed"
          exit 1