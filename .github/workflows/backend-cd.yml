name: Backend CD

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/backend-cd.yml"

  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: backend-development-${{ github.run_id }}
  cancel-in-progress: false

env:
  IMAGE_NAME: ai-knowledge-backend

jobs:
  deploy:
    name: Deploy Backend
    runs-on: ubuntu-latest
    environment: development

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Sign in to Azure using OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Sign in to Azure Container Registry
        run: |
          az acr login \
            --name "${{ vars.AZURE_CONTAINER_REGISTRY }}"

      - name: Build Docker image
        working-directory: backend
        run: |
          docker build \
            --tag "${{ vars.AZURE_CONTAINER_REGISTRY }}.azurecr.io/${IMAGE_NAME}:${{ github.sha }}" \
            --tag "${{ vars.AZURE_CONTAINER_REGISTRY }}.azurecr.io/${IMAGE_NAME}:development" \
            .

      - name: Push Docker image
        run: |
          docker push \
            "${{ vars.AZURE_CONTAINER_REGISTRY }}.azurecr.io/${IMAGE_NAME}:${{ github.sha }}"

          docker push \
            "${{ vars.AZURE_CONTAINER_REGISTRY }}.azurecr.io/${IMAGE_NAME}:development"

      - name: Deploy image to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEB_APP_NAME }}
          images: >-
            ${{ vars.AZURE_CONTAINER_REGISTRY }}.azurecr.io/ai-knowledge-backend:${{ github.sha }}

      - name: Check deployed application
        shell: bash
        run: |
          APP_URL="https://app-portfolio-api-dev-uks-crbabjgme9fvfrg8.canadacentral-01.azurewebsites.net"

          for attempt in {1..18}; do
            echo "Health check attempt ${attempt}"

            if curl --fail --silent --show-error "${APP_URL}/health"; then
              echo
              echo "Deployment succeeded"
              exit 0
            fi

            sleep 10
          done

          echo "Deployment health check failed"
          exit 1